name: Build Book PDF

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Compile revised book PDF
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile LaTeX book
        uses: xu-cheng/latex-action@v3
        with:
          root_file: book.tex
          working_directory: tex
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Publish revised PDF
        run: |
          mkdir -p output/pdf
          cp -f tex/book.pdf output/pdf/ml-by-design-concepts.pdf

      - name: Verify revised PDF
        run: test -s output/pdf/ml-by-design-concepts.pdf

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: ml-by-design
          path: output/pdf/ml-by-design-concepts.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Commit refreshed PDF
        id: commit-pdf
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f output/pdf/ml-by-design-concepts.pdf
          if git diff --cached --quiet; then
            echo "output/pdf/ml-by-design-concepts.pdf is already up to date."
          else
            git commit -m "chore: refresh compiled book PDF [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Pushed refreshed PDF to ${GITHUB_REF_NAME}."
            else
              branch="automation/refresh-book-pdf-${GITHUB_RUN_ID}"
              git push origin "HEAD:${branch}"
              echo "pr_branch=${branch}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Open PDF refresh pull request
        if: steps.commit-pdf.outputs.pr_branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "${{ steps.commit-pdf.outputs.pr_branch }}" \
            --title "chore: refresh compiled book PDF" \
            --body "Automated PDF refresh from workflow run ${GITHUB_RUN_ID}."
